name: ci

on:
  push:
    branches: [develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: build
        run: go build ./...

  # scupper dogfoods itself: its own reachability floor, enforced.
  reachability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: measure + enforce reachability
        run: |
          go build -o /tmp/scupper ./cmd/scupper
          go test -covermode=set -coverpkg=./... ./... -coverprofile=cover.out
          # Floor set at the current real number (the CLI wiring in cmd/ is not
          # yet exercised by tests). It is a floor, not a target — raise it as
          # tests are added; never lower it without reason.
          /tmp/scupper -i cover.out --require-reason -threshold 55
